<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }

        .fire-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            height: 150px;
        }

        .fire {
            font-size: 4em;
            animation: bounce 0.6s infinite alternate;
        }

        .fire:nth-child(1) {
            animation-delay: 0s;
        }

        .fire:nth-child(2) {
            animation-delay: 0.2s;
        }

        .fire:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            from {
                transform: translateY(0px);
            }
            to {
                transform: translateY(-30px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .message {
            font-size: 1.8em;
            color: #ff6b6b;
            font-weight: bold;
            margin: 30px 0;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .subtitle {
            color: #666;
            font-size: 1em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 JANGAN LUPA API BUUUU 🔥</h1>
        
        <div class="fire-container">
            <div class="fire">🔥</div>
            <div class="fire">🔥</div>
            <div class="fire">🔥</div>
        </div>

        <div class="message">
            HEIII BUUU
        </div>

        <p class="subtitle">⏳ Sedang mengingatkanmu...</p>
    </div>

    <script>
        function playAPISound() {
            try {
                // Gunakan Web Speech API untuk text-to-speech
                const utterance = new SpeechSynthesisUtterance("API API API");
                
                // Setting untuk suara yang jelas
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                utterance.lang = 'id-ID';
                
                // Cancel any previous speech
                window.speechSynthesis.cancel();
                
                // Speak the text
                window.speechSynthesis.speak(utterance);
                
                console.log("Speaking: API API API");
            } catch (e) {
                console.error("Error playing sound:", e);
            }
        }

        // Jalankan saat halaman dibuka
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                playAPISound();
            }, 500);
        });

        // Backup - jalankan juga saat window load
        window.addEventListener('load', () => {
            setTimeout(() => {
                playAPISound();
            }, 500);
        });

        // Ulangi suara setiap 3 detik
        setInterval(() => {
            playAPISound();
        }, 3000);
    </script>
</body>
</html>
